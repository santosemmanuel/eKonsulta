<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EKonsulta Forms</title>
    <link href="{{ url_for('static', filename='css/all.min.css') }}"
          rel="stylesheet" />
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}"
          rel="stylesheet" />
    <link href="{{ url_for('static', filename='css/styles.css') }}"
          rel="stylesheet" />
    <link href="{{ url_for('static', filename='css/toastr.css') }}"
          rel="stylesheet" />
    <link rel="icon"
          href="{{ url_for('static', filename='img/MHOBurauen.ico') }}" />
    <style>
        #video-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        video {
            width: 100%;
            height: auto;
            display: block;
        }
        #result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            background: #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            max-width: 500px;
            width: 100%;
            word-break: break-all;
            text-align: center;
            font-weight: bold;
        }
    </style>
  </head>
  <body>
    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-mho shadow-sm">
      <div class="container-fluid px-4">
        <a class="navbar-brand d-flex align-items-center" href="#">
          <img src="{{ url_for('static', filename='img/MHO_Logo.jpg') }}"
               class="mho-logo mr-2" />
          <div>
            <i class="fa-solid fa-notes-medical me-1"></i>eKonsultaForms
            <small>Electronic Konsulta Forms Processing System</small>
          </div>
        </a>
        <!-- Hamburger button for small screens -->
        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarMenu"
                aria-controls="navbarMenu"
                aria-expanded="false"
                aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <!-- Collapsible menu -->
        <div class="collapse navbar-collapse" id="navbarMenu">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item text-white">
              <a class="dropdown-item" href="{{ url_for("logout") }}">
                <i class="fa-solid fa-right-to-bracket me-1"></i> Logout</a>
            </li>
            
          </ul>
        </div>
      </div>
    </nav>
    <!-- MAIN CONTENT -->
    <div class="container py-4">
      <div class="row g-4">
    
    <div id="video-container">
        <video id="webcam" autoplay playsinline></video>
    </div>

    <div id="result">Scanning for QR code...</div>

    <script>
        const video = document.getElementById('webcam');
        const resultDiv = document.getElementById('result');

        // 1. Check if the BarcodeDetector API is supported by the browser
        if (!('BarcodeDetector' in window)) {
            resultDiv.innerText = "Barcode Detector API is not supported in this browser. Try Chrome, Edge, or Safari.";
        } else {
            // Create a detector specifically looking for QR codes
            const detector = new BarcodeDetector({ formats: ['qr_code'] });
            
            // 2. Start the camera stream
            async function startCamera() {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ 
                        video: { facingMode: "environment" } // Prefers the rear camera on mobile
                    });
                    video.srcObject = stream;
                    
                    // Start scanning once the video metadata is loaded
                    video.addEventListener('loadedmetadata', () => {
                        scanFrame(detector);
                    });
                } catch (err) {
                    console.error("Camera access denied or failed: ", err);
                    resultDiv.innerText = "Error: Camera access denied.";
                }
            }

            // 3. Continuously grab frames from the video and detect QR codes
            async function scanFrame(detector) {
                try {
                    // Detect barcodes in the video element
                    const barcodes = await detector.detect(video);
                    
                    if (barcodes.length > 0) {
                        // Found a QR code! Grab the first one detected
                        const detectedValue = barcodes[0].rawValue;
                        
                    }
                } catch (e) {
                    console.error("Detection failed: ", e);
                }
                
                // Keep the loop going frame-by-frame
                requestAnimationFrame(() => scanFrame(detector));
            }

            // Fire it up
            startCamera();
        }
    </script>
      </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="{{ url_for('static', filename='js/toastr.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/main.js')}}">alert(1)</script>
    <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
  </body>
</html>
