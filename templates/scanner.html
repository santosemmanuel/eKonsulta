<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EKonsulta Forms</title>
    <link href="{{ url_for('static', filename='css/all.min.css') }}"
          rel="stylesheet" />
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}"
          rel="stylesheet" />
    <link href="{{ url_for('static', filename='css/styles.css') }}"
          rel="stylesheet" />
    
    <link rel="icon"
          href="{{ url_for('static', filename='img/MHOBurauen.ico') }}" />
    <script src="{{ url_for('static', filename='js/jsQR.js') }}"></script>
    <style>
        #video-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        video {
            width: 100%;
            height: auto;
            display: block;
        }
        #result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            background: #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            max-width: 500px;
            width: 100%;
            word-break: break-all;
            text-align: center;
            font-weight: bold;
        }
    </style>
  </head>
  <body>
    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-mho shadow-sm">
      <div class="container-fluid px-4">
        <a class="navbar-brand d-flex align-items-center" href="#">
          <img src="{{ url_for('static', filename='img/MHO_Logo.jpg') }}"
               class="mho-logo mr-2" />
          <div>
            <i class="fa-solid fa-notes-medical me-1"></i>eKonsultaForms
            <small>Electronic Konsulta Forms Processing System</small>
          </div>
        </a>
        <!-- Hamburger button for small screens -->
        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarMenu"
                aria-controls="navbarMenu"
                aria-expanded="false"
                aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <!-- Collapsible menu -->
        <div class="collapse navbar-collapse" id="navbarMenu">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item text-white">
              <a class="dropdown-item" href="{{ url_for("logout") }}">
                <i class="fa-solid fa-right-to-bracket me-1"></i> Logout</a>
            </li>
            
          </ul>
        </div>
      </div>
    </nav>
    <!-- MAIN CONTENT -->
    <div class="container py-4">
      <div class="row g-4">
    
    <h2>Universal QR Code Scanner</h2>
    <div id="method-badge">Detecting scanning engine...</div>
    
    <div id="video-container">
        <video id="webcam" autoplay playsinline></video>
    </div>

    <div id="result">Initializing camera...</div>

    <canvas id="hidden-canvas" style="display: none;"></canvas>

    <script>
        const video = document.getElementById('webcam');
        const resultDiv = document.getElementById('result');
        const badge = document.getElementById('method-badge');
        const canvas = document.getElementById('hidden-canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment" } 
                });
                video.srcObject = stream;
                
                video.addEventListener('loadedmetadata', () => {
                    initScanner();
                });
            } catch (err) {
                console.error("Camera access failed: ", err);
                resultDiv.innerText = "Error: Camera access denied.";
            }
        }

        function initScanner() {
            resultDiv.innerText = "Scanning for QR code...";

            // Check if Native API is supported
            if ('BarcodeDetector' in window) {
                badge.innerText = "Engine: Native BarcodeDetector API";
                const detector = new BarcodeDetector({ formats: ['qr_code'] });
                scanNative(detector);
            } else {
                badge.innerText = "Engine: jsQR Library Fallback";
                scanFallback();
            }
        }

        // METHOD 1: Native Scanning
        async function scanNative(detector) {
            try {
                const barcodes = await detector.detect(video);
                if (barcodes.length > 0) {
                    showResult(barcodes[0].rawValue);
                }
            } catch (e) {
                console.error(e);
            }
            requestAnimationFrame(() => scanNative(detector));
        }

        // METHOD 2: Canvas + jsQR Fallback 
        function scanFallback() {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                // Match canvas sizes to stream dimensions
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                
                // Draw current video frame to the hidden canvas
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                // Extract image pixel data (RGBA array)
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                
                // Parse pixel data via jsQR
                const code = jsQR(imageData.data, imageData.width, imageData.height, {
                    inversionAttempts: "dontInvert",
                });

                if (code) {
                    showResult(code.data);
                }
            }
            requestAnimationFrame(scanFallback);
        }

        // UI update helper
        function showResult(value) {
            
            resultDiv.innerHTML = `<strong>Result:</strong> <a href="${value}" target="_blank">${value}</a>`;
            fetch("/saveScanned", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: value
                }).then((res) => res.json())
                    .then((data) => {
                                if (data.success) showSuccess("Images Saved!");
                            })
            .catch((err) => console.error(err));
                
        }

        // Kick off the scanner
        startCamera();
    </script>
      </div>
    </div>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
        <script src="{{ url_for('static', filename='js/sweetalert-init.js') }}"></script>
        <script src="{{ url_for('static', filename='js/main.js') }}"></script>
        <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
  </body>
</html>
