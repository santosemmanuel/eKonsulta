<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EKonsulta Forms</title>
    <link href="{{ url_for('static', filename='css/all.min.css') }}"
          rel="stylesheet" />
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}"
          rel="stylesheet" />
    <link href="{{ url_for('static', filename='css/styles.css') }}"
          rel="stylesheet" />
    <link href="{{ url_for('static', filename='css/sweetalert2.min.css') }}"
          rel="stylesheet" />
    
    <link rel="icon"
          href="{{ url_for('static', filename='img/MHOBurauen.ico') }}" />
  
    <style>
      body{
            background:#f5f7fa;
        }

        /* Center everything */
        .main-container{
            min-height:80vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .menu-card{
            height:280px;
            border:none;
            border-radius:20px;
            cursor:pointer;
            transition:all .3s ease;
            box-shadow:0 8px 25px rgba(0,0,0,.10);
        }

        .menu-card:hover{
            transform:translateY(-10px);
            box-shadow:0 15px 35px rgba(0,0,0,.18);
            background:#198754;
            color:#fff;
        }

        .menu-card:hover .menu-icon{
            color:#fff;
        }

        .menu-icon{
            font-size:70px;
            color:#198754;
            transition:.3s;
        }

        .menu-title{
            font-size:28px;
            font-weight:700;
            margin-top:20px;
        }

        .menu-description{
            color:#6c757d;
            font-size:15px;
        }

        .menu-card:hover .menu-description{
            color:#f8f9fa;
        }
    </style>
  </head>
  <body>
    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-mho shadow-sm">
      <div class="container px-4">
        <a class="navbar-brand d-flex align-items-center" href="#">
          <img src="{{ url_for('static', filename='img/MHO_Logo.jpg') }}"
               class="mho-logo mr-2" />
          <div>
            <i class="fa-solid fa-notes-medical me-1"></i>eYakapForms
            <small>Electronic Yakap Forms Processing System</small>
          </div>
        </a>
        <!-- Hamburger button for small screens -->
        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarMenu"
                aria-controls="navbarMenu"
                aria-expanded="false"
                aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <!-- Collapsible menu -->
        <div class="collapse navbar-collapse" id="navbarMenu">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link text-white" href="{{ url_for('index') }}">
                <i class="fa-solid fa-house me-1"></i>Home</a>
            </li>
          <li class="nav-item dropdown">
          <a class="nav-link text-white dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
            | &nbsp;<i class="fa-solid fa-user me-1 ms-1"></i> {{ user }}
          </a>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="{{ url_for("logout") }}">
              <i class="fa-solid fa-right-to-bracket me-1"></i> Logout</a>
            </li>
            <li><a class="dropdown-item" href="#">Settings</a></li>
            <li><a class="dropdown-item" href="#">Profile</a></li>
          </ul>
        </li>
            
          </ul>
        </div>
      </div>
    </nav>
    <!-- MAIN CONTENT -->
    <div class="container-fluid main-container">
      <div class="row g-4">
        <div class="row justify-content-center g-4 w-100">

        <!-- Registration -->
        <div class="col-lg-4 col-md-6">
            <div class="card menu-card" id="RegTransferCard">
                <div class="card-body d-flex flex-column justify-content-center align-items-center text-center">

                    <i class="fa-solid fa-user-plus menu-icon"></i>

                    <div class="menu-title">
                        Registration or Transfer
                    </div>

                    <div class="menu-description">
                        Register or Transfer Patient
                    </div>

                </div>
            </div>
        </div>

        <!-- First Encounter -->
        <div class="col-lg-4 col-md-6">
            <div class="card menu-card" id="FirstEncounterCard">
                <div class="card-body d-flex flex-column justify-content-center align-items-center text-center">

                    <i class="fa-solid fa-file-medical menu-icon"></i>

                    <div class="menu-title">
                        1st Encounter
                    </div>

                    <div class="menu-description">
                        Process the patient's first encounter (FPE).
                    </div>

                </div>
            </div>
        </div>

        <!-- Second Encounter -->
        <div class="col-lg-4 col-md-6">
            <div class="card menu-card" id="SecondEncounterCard">
                <div class="card-body d-flex flex-column justify-content-center align-items-center text-center">

                    <i class="fa-solid fa-notes-medical menu-icon"></i>

                    <div class="menu-title">
                        2nd Encounter
                    </div>

                    <div class="menu-description">
                        Patient's second encounter.
                    </div>

                </div>
            </div>
        </div>

    </div>
        
      </div>
    </div>
    <script>const pdfFiles = {{ pdf_files | tojson }};</script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="{{ url_for('static', filename='js/sweetalert2.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/sweetalert-init.js') }}"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
  </body>
</html>
